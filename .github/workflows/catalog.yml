name: catalog

# 하루 두 번(한국시간 06:17, 18:17) 상품을 다시 모아 gh-pages 브랜치로 배포합니다.
on:
  schedule:
    - cron: '17 21 * * *'
    - cron: '17 9 * * *'
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: catalog
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2

      - name: 이전 배포본 가져오기 (가격 이력 비교용)
        run: |
          git clone --quiet --depth=1 --branch gh-pages "https://github.com/${GITHUB_REPOSITORY}.git" _prev 2>/dev/null || mkdir -p _prev

      - name: 수집할지, 이전 데이터를 재사용할지 결정
        id: mode
        run: |
          REUSE=0
          if [ "${{ github.event_name }}" = "push" ] && [ -f _prev/data/meta.json ]; then
            if git rev-parse HEAD~1 >/dev/null 2>&1; then
              if ! git diff --name-only HEAD~1 HEAD | grep -qE '^(scripts|config)/'; then REUSE=1; fi
            fi
          fi
          echo "reuse=$REUSE" >> "$GITHUB_OUTPUT"

      - name: 카탈로그 수집 + 사이트 만들기
        run: node scripts/fetch.mjs
        env:
          REUSE: ${{ steps.mode.outputs.reuse }}
          OUT_DIR: _site
          PREV_DIR: _prev

      - name: gh-pages 브랜치로 배포
        run: |
          cd _site
          git init --quiet -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit --quiet -m "site $(date -u +%FT%RZ)"
          git push --quiet --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
