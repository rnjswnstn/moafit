<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MOAFIT</title>
<meta name="description" content="무신사·크림에서 고른 옷을 한곳에 모으고, 한 장의 보드로 정리하는 개인 옷 모음">
<meta name="theme-color" content="#F6F6F3">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="MOAFIT">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Condensed:wght@500;600;700&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
:root{
  --paper:#F6F6F3; --card:#FFFFFF; --ink:#000000; --ink2:#5C5C57; --ink3:#8E8E87;
  --line:#DCDCD6; --photo:#ECECE7; --cobalt:#1F33E0; --sticker:#F4E409; --drop:#E0002B;
  --f:'IBM Plex Sans KR',system-ui,-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --fc:'IBM Plex Sans Condensed','IBM Plex Sans KR',system-ui,sans-serif;
  --tab:58px; --sab:env(safe-area-inset-bottom,0px); --sat:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--paper);color:var(--ink);font:400 15px/1.5 var(--f);-webkit-font-smoothing:antialiased;overscroll-behavior-y:none;word-break:keep-all;overflow-wrap:anywhere;padding-bottom:calc(var(--tab) + var(--sab) + 24px)}
body.lock{overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer;-webkit-tap-highlight-color:transparent;text-align:inherit}
a{color:inherit}
img{display:block;max-width:100%}
:focus-visible{outline:2px solid var(--cobalt);outline-offset:2px}
.num{font-family:var(--fc);font-variant-numeric:tabular-nums}
.wrap{max-width:1240px;margin:0 auto;padding:0 14px}
.hide{display:none!important}

.top{position:sticky;top:0;z-index:20;background:var(--paper);padding-top:var(--sat);border-bottom:1px solid var(--ink)}
.top .wrap{display:flex;align-items:baseline;justify-content:space-between;height:50px;padding-top:12px}
.mark{font:700 23px/1 var(--fc);letter-spacing:-.01em;text-decoration:none}
.stamp{font-size:12px;color:var(--ink2)}

.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--card);border-top:1px solid var(--ink);padding-bottom:var(--sab)}
.tabs ul{list-style:none;display:flex;max-width:520px;margin:0 auto;height:var(--tab)}
.tabs li{flex:1}
.tabs a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;height:100%;text-decoration:none;font-size:11px;font-weight:500;color:var(--ink3);position:relative}
.tabs a svg{width:23px;height:23px}
.tabs a[aria-current=page]{color:var(--ink)}
.tabs a[aria-current=page]::before{content:"";position:absolute;top:-1px;left:24%;right:24%;height:3px;background:var(--cobalt)}
.tabs .cnt{position:absolute;top:7px;left:calc(50% + 7px);min-width:16px;height:16px;padding:0 4px;border-radius:8px;background:var(--ink);color:#fff;font:600 10px/16px var(--fc);text-align:center}
svg.ic{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
svg.ic.s{width:16px;height:16px}

.lead{font-weight:700;font-size:25px;line-height:1.28;letter-spacing:-.025em;padding:22px 0 14px;max-width:24em;text-wrap:balance}
.note{font-size:13px;color:var(--ink2)}

/* 통합 검색 + 담기 */
.find{border:1px solid var(--ink);border-radius:4px;background:var(--card);padding:12px;margin-top:16px}
.find .chips{margin:10px -12px 0;padding:0 12px}
.find .hint{font-size:12.5px;color:var(--ink2);margin-top:9px}

/* 모음: 핀터레스트식 격자 */
.masonry{display:flex;gap:10px;align-items:flex-start}
.mcol{flex:1;min-width:0;display:flex;flex-direction:column;gap:18px}
.pin2{min-width:0}
.pimg{display:block;width:100%;background:var(--photo);border-radius:3px;overflow:hidden;position:relative;min-height:110px}
.pimg img{width:100%;height:auto;mix-blend-mode:multiply}
.pimg.fix img{height:100%;object-fit:cover}
.mtag{position:absolute;left:6px;top:6px;font:700 10.5px/1 var(--fc);padding:4px 6px;border-radius:2px;background:var(--card);letter-spacing:.01em}
.mtag.mu{background:var(--ink);color:#fff}
.mtag.kr{background:var(--card);border:1px solid var(--ink)}
.mtag.st{background:var(--cobalt);color:#fff}

/* 스토어 상품 격자 */
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:22px 10px}
@media(min-width:620px){.grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:26px 14px}}
@media(min-width:900px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media(min-width:1160px){.grid{grid-template-columns:repeat(5,minmax(0,1fr))}}
.card{position:relative;min-width:0}
.ph{display:block;width:100%;aspect-ratio:4/5;background:var(--photo);border-radius:3px;overflow:hidden;position:relative}
.ph img{width:100%;height:100%;object-fit:cover;mix-blend-mode:multiply}
.ph.gone img{opacity:.45}
.badges{position:absolute;left:6px;top:6px;display:flex;flex-direction:column;gap:4px;align-items:flex-start;pointer-events:none}
.bd{font:700 11px/1 var(--fc);padding:4px 6px;border-radius:2px;background:var(--card)}
.bd.out{background:var(--ink);color:#fff}
.pin{position:absolute;right:5px;top:5px;width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.92);display:grid;place-items:center}
.pin svg{width:19px;height:19px}
.pin[aria-pressed=true] svg{fill:var(--ink)}
.tag{padding:8px 1px 0}
.brand{font:600 12.5px/1.25 var(--fc);letter-spacing:.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand small{font:400 11px var(--f);color:var(--ink3);margin-left:5px}
.title{font-size:13.5px;line-height:1.38;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin-top:2px}
.card .title{min-height:2.76em}
.price{display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 6px;margin-top:5px}
.price .now{font:700 16.5px/1.1 var(--fc);font-variant-numeric:tabular-nums}
.price .now small{font:500 11.5px var(--f);margin-left:1px}
.price .pct,.price .dn{font:700 12.5px var(--fc);color:var(--drop)}
.price .up{font:700 12.5px var(--fc);color:var(--ink2)}
.price .approx{font-size:11px;color:var(--ink3)}
.run{display:flex;flex-wrap:wrap;gap:3px;margin-top:7px;min-height:20px}
.sz{min-width:22px;height:20px;padding:0 4px;border:1px solid var(--line);background:var(--card);font:600 11px/18px var(--fc);text-align:center;white-space:nowrap}
.sz.out{color:var(--ink3);background:linear-gradient(to top right,transparent calc(50% - .6px),var(--line) calc(50% - .6px),var(--line) calc(50% + .6px),transparent calc(50% + .6px))}
.sz.me{background:var(--cobalt);border-color:var(--cobalt);color:#fff}
.sz.me.out{background:var(--card);color:var(--cobalt);border-style:dashed;text-decoration:line-through}
.sz.more{border-color:transparent;background:none;color:var(--ink3);padding:0 1px}
.run.big{gap:6px;margin-top:10px}
.run.big .sz{min-width:44px;height:40px;font-size:15px;line-height:38px;padding:0 8px}

.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 -14px;padding:0 14px}
.chips::-webkit-scrollbar{display:none}
.chips.wrapx{flex-wrap:wrap;overflow:visible;margin:0;padding:0;row-gap:7px}
.chip{flex:none;height:34px;padding:0 13px;border:1px solid var(--ink);border-radius:17px;background:var(--card);font-size:13.5px;font-weight:500;white-space:nowrap;display:inline-flex;align-items:center;gap:6px;text-decoration:none}
.chip[aria-pressed=true]{background:var(--ink);color:#fff}
.chip.sq{border-radius:3px;min-width:44px;justify-content:center;font-family:var(--fc);font-weight:600;font-size:14.5px}
.chip.sq[aria-pressed=true]{background:var(--cobalt);border-color:var(--cobalt)}
.chip .sw{width:14px;height:14px;border-radius:50%;border:1px solid rgba(0,0,0,.25)}
.chip.go{border-color:var(--line)}
.field{display:flex;align-items:center;gap:8px;height:46px;border:1px solid var(--ink);border-radius:4px;background:var(--card);padding:0 12px}
.field input,.field select{flex:1;min-width:0;border:0;background:none;outline:0;height:100%;font-size:16px}
.field:focus-within{outline:2px solid var(--cobalt);outline-offset:1px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:48px;padding:0 18px;border:1px solid var(--ink);border-radius:4px;background:var(--card);font-weight:600;font-size:15px;text-decoration:none;white-space:nowrap}
.btn.pri{background:var(--cobalt);border-color:var(--cobalt);color:#fff}
.btn.ink{background:var(--ink);color:#fff}
.btn.sm{height:38px;font-size:13.5px;padding:0 13px}
.btn.wide{width:100%}
.btn[disabled]{opacity:.45;cursor:default}
.row{display:flex;gap:8px;align-items:center}
.row > .grow{flex:1;min-width:0}
.bar{position:sticky;top:calc(51px + var(--sat));z-index:15;background:var(--paper);padding:10px 0}
.bar .chips{margin-top:9px}
.meta{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:4px 0 14px;font-size:13px;color:var(--ink2)}
.meta select{border:0;background:none;font-weight:600;color:var(--ink);font-size:13.5px;padding:4px 0}
.empty{border:1px dashed var(--ink3);border-radius:4px;padding:24px 18px;background:var(--card)}
.empty h3{font-size:16px;font-weight:700;margin-bottom:6px;letter-spacing:-.01em}
.empty p{font-size:14px;color:var(--ink2);margin-bottom:14px;max-width:34em}
.empty ol{font-size:14px;color:var(--ink2);margin:0 0 14px 1.2em}
.skel{aspect-ratio:4/5;background:var(--photo);border-radius:3px}

/* 시트 */
.sheet-wrap{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center}
.scrim{position:absolute;inset:0;background:rgba(0,0,0,.45);opacity:0;transition:opacity .18s}
.sheet{position:relative;width:100%;max-width:560px;max-height:calc(100dvh - 28px - var(--sat));background:var(--paper);border-radius:14px 14px 0 0;display:flex;flex-direction:column;transform:translateY(24px);opacity:0;transition:transform .2s ease,opacity .18s}
.sheet.full{height:calc(100dvh - 28px - var(--sat))}
.sheet-wrap.on .scrim{opacity:1}
.sheet-wrap.on .sheet{transform:none;opacity:1}
@media(min-width:700px){.sheet-wrap{align-items:center}.sheet{border-radius:10px;max-height:min(900px,calc(100dvh - 48px))}.sheet.full{height:min(900px,calc(100dvh - 48px))}}
.sh-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 14px 12px 16px;border-bottom:1px solid var(--line);flex:none}
.sh-head h2{font-size:16px;font-weight:700;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.x{width:36px;height:36px;display:grid;place-items:center;border-radius:50%;flex:none}
.sh-body{overflow-y:auto;padding:16px;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;flex:1;min-height:0}
.sh-foot{flex:none;display:flex;gap:8px;padding:10px 14px calc(10px + var(--sab));border-top:1px solid var(--line);background:var(--paper)}
.sh-foot .btn{flex:1;padding:0 10px}
.sh-foot .btn.fix{flex:0 0 48px;padding:0}
.fs{margin-bottom:22px}
.fs > h3{font-size:14px;font-weight:700;margin-bottom:9px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.fs > h3 span{font-weight:400;font-size:12px;color:var(--ink2)}

.gal{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;margin:-16px -16px 14px;scrollbar-width:none;background:var(--photo)}
.gal::-webkit-scrollbar{display:none}
.gal img{flex:0 0 100%;aspect-ratio:1/1;object-fit:contain;scroll-snap-align:center;mix-blend-mode:multiply}
.gal.two img{flex-basis:88%}
.d-brand{font:600 14px var(--fc)}
.d-title{font-size:18px;font-weight:600;line-height:1.35;letter-spacing:-.015em;margin:2px 0 4px}
.d-sub{font-size:12.5px;color:var(--ink2);margin-top:4px}
.d-price .now{font-size:24px}
.kv{margin-top:16px;border-top:1px solid var(--line)}
.kv div{display:flex;justify-content:space-between;gap:14px;padding:9px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.kv dt{color:var(--ink2);flex:none}
.kv dd{text-align:right;min-width:0}
.linkrow{display:flex;gap:6px;flex-wrap:wrap;margin-top:14px}
.malls{border:1px solid var(--ink);background:var(--card);border-radius:4px;padding:12px;margin-top:16px}
.malls p{font-size:13px;margin-bottom:9px}
.malls .chips{margin:0 -12px;padding:0 12px}
.prev{display:flex;gap:12px;align-items:flex-start}
.prev .th{flex:0 0 96px;aspect-ratio:4/5;background:var(--photo);border-radius:3px;overflow:hidden}
.prev .th img{width:100%;height:100%;object-fit:cover;mix-blend-mode:multiply}

/* 보드 */
.blist{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px 10px;margin-top:16px}
@media(min-width:700px){.blist{grid-template-columns:repeat(4,minmax(0,1fr))}}
.bcard .bthumb{display:block;width:100%;aspect-ratio:3/4;border:1px solid var(--ink);border-radius:3px;overflow:hidden;position:relative;background:var(--card)}
.bcard .bthumb img{width:100%;height:100%;object-fit:cover}
.bcard h3{font-size:14px;font-weight:600;margin-top:7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bcard p{font-size:12px;color:var(--ink2)}
.stage{position:relative;width:min(100%,calc(56dvh * .75),470px);aspect-ratio:3/4;margin:0 auto;border:1px solid var(--ink);overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;background:#fff}
.stage.mini{width:100%;border:0;pointer-events:none}
.pc{position:absolute;transform-origin:center;cursor:grab;line-height:0}
.pc img{width:100%;height:auto;pointer-events:none;-webkit-user-drag:none}
.pc.sel{outline:1.5px dashed var(--cobalt);outline-offset:3px}
.ptools{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:10px -16px 0;padding:0 16px;min-height:38px}
.ptools::-webkit-scrollbar{display:none}
.ptools .btn{flex:none}
.etools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:12px}
.sws{display:flex;gap:6px;align-items:center}
.sws button{width:28px;height:28px;border-radius:50%;border:1px solid var(--ink3)}
.sws button[aria-pressed=true]{outline:2px solid var(--cobalt);outline-offset:2px}
.pick{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pick button{display:block;aspect-ratio:4/5;background:var(--photo);border-radius:3px;overflow:hidden;position:relative}
.pick img{width:100%;height:100%;object-fit:cover;mix-blend-mode:multiply}
.pick button[aria-pressed=true]{outline:3px solid var(--cobalt);outline-offset:-3px}
.pick button[aria-pressed=true]::after{content:"✓";position:absolute;right:6px;top:6px;width:22px;height:22px;border-radius:50%;background:var(--cobalt);color:#fff;font:700 13px/22px var(--f);text-align:center}
.shot{width:100%;border:1px solid var(--ink)}

.panel{border:1px solid var(--ink);border-radius:4px;background:var(--card);padding:14px;margin-bottom:12px}
.panel h3{font-size:15px;font-weight:700;margin-bottom:8px;letter-spacing:-.01em}
.panel p{font-size:13.5px;color:var(--ink2)}
.panel .row{margin-top:12px;flex-wrap:wrap}
.src{width:100%;border-collapse:collapse;font-size:13px;margin-top:6px}
.src td{padding:7px 0;border-bottom:1px solid var(--line);vertical-align:top}
.src td:last-child{text-align:right;white-space:nowrap}
.src .st{font-size:11.5px;color:var(--ink2);display:block}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--ink3);margin-right:6px;vertical-align:1px}
.dot.ok{background:#1E9E55}.dot.stale{background:#D9A300}.dot.bad{background:var(--drop)}

.toast{position:fixed;left:50%;bottom:calc(var(--tab) + var(--sab) + 14px);transform:translate(-50%,12px);background:var(--ink);color:#fff;font-size:13.5px;padding:10px 16px;border-radius:4px;z-index:80;opacity:0;transition:.2s;pointer-events:none;max-width:calc(100vw - 32px);text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <a class="mark" href="#home">MOAFIT</a>
  <span class="stamp" id="stamp"></span>
</div></header>

<main class="wrap" id="view" tabindex="-1"></main>

<nav class="tabs" aria-label="메뉴"><ul>
  <li><a href="#home" data-tab="home"><svg class="ic" viewBox="0 0 24 24"><rect x="4" y="4" width="7" height="9" rx="1"/><rect x="13" y="4" width="7" height="6" rx="1"/><rect x="4" y="15" width="7" height="5" rx="1"/><rect x="13" y="12" width="7" height="8" rx="1"/></svg>모음<span class="cnt hide" id="saveCnt"></span></a></li>
  <li><a href="#boards" data-tab="boards"><svg class="ic" viewBox="0 0 24 24"><rect x="4.5" y="3.500" width="15" height="17" rx="1"/><path d="M8 8h4v5H8zM14 11h2.500v6H14zM8 15.500h3"/></svg>보드</a></li>
  <li><a href="#store" data-tab="store"><svg class="ic" viewBox="0 0 24 24"><path d="M3.5 12.3V4h8.3l8.7 8.7-7.9 7.9z"/><circle cx="8" cy="8.5" r="1.3"/></svg>스토어</a></li>
  <li><a href="#my" data-tab="my"><svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.6"/><path d="M4.6 20c.8-3.500 3.800-5.400 7.400-5.400s6.600 1.900 7.400 5.400"/></svg>MY</a></li>
</ul></nav>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
'use strict';
/* ═════════════ 기본 도구 ═════════════ */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const won = (n) => Math.round(n).toLocaleString('ko-KR');
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const fold = (s) => String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').normalize('NFC');
const TODAY = new Date().toISOString().slice(0, 10);
const daysSince = (d) => (d ? Math.floor((Date.now() - new Date(d).getTime()) / 864e5) : 9999);
const hash = (s) => { let h = 2166136261; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return ((h >>> 0) % 1000) / 1000; };
const uid = (p) => p + Date.now().toString(36) + Math.floor(Math.random() * 1296).toString(36);
const IC = {
  heart: '<svg class="ic" viewBox="0 0 24 24"><path d="M12 20.3S4.5 15.8 4.5 10.2A4.2 4.2 0 0 1 12 7.7a4.2 4.2 0 0 1 7.5 2.5c0 5.6-7.5 10.1-7.5 10.1z"/></svg>',
  x: '<svg class="ic" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg>',
  search: '<svg class="ic" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4.5 4.5"/></svg>',
  filter: '<svg class="ic" viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg>',
  plus: '<svg class="ic" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>',
  out: '<svg class="ic s" viewBox="0 0 24 24"><path d="M14 5h5v5M19 5l-8 8M11 7H6v11h11v-5"/></svg>',
  trash: '<svg class="ic s" viewBox="0 0 24 24"><path d="M5 7h14M10 7V5h4v2M7 7l1 12h8l1-12"/></svg>',
