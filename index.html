<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MOAFIT</title>
<meta name="description" content="여러 스토어의 옷을 한곳에 모아, 내 사이즈와 취향 순으로 보여주는 개인 셀렉트샵">
<meta name="theme-color" content="#F6F6F3">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="MOAFIT">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Condensed:wght@500;600;700&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
:root{
  --paper:#F6F6F3; --card:#FFFFFF; --ink:#000000; --ink2:#5C5C57; --ink3:#8E8E87;
  --line:#DCDCD6; --photo:#ECECE7; --cobalt:#1F33E0; --sticker:#F4E409; --drop:#E0002B;
  --f:'IBM Plex Sans KR',system-ui,-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --fc:'IBM Plex Sans Condensed','IBM Plex Sans KR',system-ui,sans-serif;
  --tab:58px; --sab:env(safe-area-inset-bottom,0px); --sat:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%;scroll-behavior:auto}
body{background:var(--paper);color:var(--ink);font:400 15px/1.5 var(--f);-webkit-font-smoothing:antialiased;overscroll-behavior-y:none;padding-bottom:calc(var(--tab) + var(--sab) + 24px)}
body.lock{overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer;-webkit-tap-highlight-color:transparent;text-align:inherit}
a{color:inherit}
img{display:block;max-width:100%}
:focus-visible{outline:2px solid var(--cobalt);outline-offset:2px}
.num{font-family:var(--fc);font-variant-numeric:tabular-nums}
.wrap{max-width:1240px;margin:0 auto;padding:0 14px}
.hide{display:none!important}

/* 상단 */
.top{position:sticky;top:0;z-index:20;background:var(--paper);padding-top:var(--sat);border-bottom:1px solid var(--ink)}
.top .wrap{display:flex;align-items:baseline;justify-content:space-between;height:50px;padding-top:12px}
.mark{font:700 23px/1 var(--fc);letter-spacing:-.01em;text-decoration:none}
.stamp{font-size:12px;color:var(--ink2)}

/* 하단 탭 */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--card);border-top:1px solid var(--ink);padding-bottom:var(--sab)}
.tabs ul{list-style:none;display:flex;max-width:560px;margin:0 auto;height:var(--tab)}
.tabs li{flex:1}
.tabs a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;height:100%;text-decoration:none;font-size:11px;font-weight:500;color:var(--ink3);position:relative}
.tabs a svg{width:23px;height:23px}
.tabs a[aria-current=page]{color:var(--ink)}
.tabs a[aria-current=page]::before{content:"";position:absolute;top:-1px;left:22%;right:22%;height:3px;background:var(--cobalt)}
.tabs .cnt{position:absolute;top:7px;left:calc(50% + 7px);min-width:16px;height:16px;padding:0 4px;border-radius:8px;background:var(--ink);color:#fff;font:600 10px/16px var(--fc);text-align:center}

svg.ic{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* 제목류 */
.lead{font-weight:700;font-size:25px;line-height:1.28;letter-spacing:-.025em;padding:22px 0 14px;max-width:18em}
.sec{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding:26px 0 12px}
.sec h2{font-size:17px;font-weight:700;letter-spacing:-.02em}
.sec .more{font-size:13px;color:var(--ink2);text-decoration:underline;text-underline-offset:3px}
.note{font-size:13px;color:var(--ink2)}

/* 사이즈 스트립 — 새 옷에 붙는 사이즈 스티커 */
.strip{display:flex;width:100%;border-top:1px solid var(--ink);border-bottom:1px solid var(--ink);background:var(--card);overflow:hidden;height:38px;align-items:stretch}
.strip .seg{display:flex;align-items:center;gap:12px;padding:0 12px;border-right:1px solid var(--ink);white-space:nowrap;flex:1 1 0;min-width:0;overflow:hidden}
.strip .seg:last-child{border-right:0}
.strip .seg i{font-style:normal;font-size:11px;color:var(--ink2);flex:none}
.strip .seg b{font:700 17px/1 var(--fc);flex:none}
.strip .seg b + b{opacity:.28}
.strip.empty{align-items:center;justify-content:space-between;padding:0 12px;font-size:13px}
.strip.empty u{text-underline-offset:3px;font-weight:600}

/* 상품 그리드 */
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:22px 10px}
@media(min-width:620px){.grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:26px 14px}}
@media(min-width:900px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media(min-width:1160px){.grid{grid-template-columns:repeat(5,minmax(0,1fr))}}
.rail{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x proximity;margin:0 -14px;padding:0 14px 4px;scrollbar-width:none}
.rail::-webkit-scrollbar{display:none}
.rail .card{flex:0 0 150px;scroll-snap-align:start}

.card{position:relative;min-width:0}
.ph{display:block;width:100%;aspect-ratio:4/5;background:var(--photo);border-radius:3px;overflow:hidden;position:relative}
.ph img{width:100%;height:100%;object-fit:cover;mix-blend-mode:multiply}
.ph.gone img{opacity:.45}
.badges{position:absolute;left:6px;top:6px;display:flex;flex-direction:column;gap:4px;align-items:flex-start;pointer-events:none}
.bd{font:700 11px/1 var(--fc);padding:4px 6px;border-radius:2px;background:var(--card);letter-spacing:.01em}
.bd.new{background:var(--sticker);transform:rotate(-3deg)}
.bd.sale{background:var(--drop);color:#fff}
.bd.out{background:var(--ink);color:#fff}
.bd.own{background:var(--cobalt);color:#fff}
.pin{position:absolute;right:5px;top:5px;width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.92);display:grid;place-items:center}
.pin svg{width:19px;height:19px}
.pin[aria-pressed=true] svg{fill:var(--ink)}
.tag{padding:8px 1px 0}
.brand{font:600 12.5px/1.25 var(--fc);letter-spacing:.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand small{font:400 11px var(--f);color:var(--ink3);margin-left:5px}
.title{font-size:13.5px;line-height:1.38;color:var(--ink);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin-top:2px;min-height:2.76em}
.price{display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 6px;margin-top:5px}
.price .now{font:700 16.5px/1.1 var(--fc);font-variant-numeric:tabular-nums}
.price .now small{font:500 11.5px var(--f);margin-left:1px}
.price .was{font:500 12px var(--fc);color:var(--ink3);text-decoration:line-through}
.price .pct,.price .dn{font:700 12.5px var(--fc);color:var(--drop)}
.price .approx{font-size:11px;color:var(--ink3)}
.run{display:flex;flex-wrap:wrap;gap:3px;margin-top:7px;min-height:20px}
.sz{min-width:22px;height:20px;padding:0 4px;border:1px solid var(--line);background:var(--card);font:600 11px/18px var(--fc);text-align:center;color:var(--ink);white-space:nowrap}
.sz.out{color:var(--ink3);background:linear-gradient(to top right,transparent calc(50% - .6px),var(--line) calc(50% - .6px),var(--line) calc(50% + .6px),transparent calc(50% + .6px))}
.sz.me{background:var(--cobalt);border-color:var(--cobalt);color:#fff}
.sz.me.out{background:var(--card);color:var(--cobalt);border-style:dashed;text-decoration:line-through}
.sz.more{border-color:transparent;background:none;color:var(--ink3);padding:0 1px}
.run.big{gap:6px;margin-top:10px}
.run.big .sz{min-width:44px;height:40px;font-size:15px;line-height:38px;padding:0 8px}

/* 칩 · 입력 */
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 -14px;padding:0 14px}
.chips::-webkit-scrollbar{display:none}
.chips.wrapx{flex-wrap:wrap;overflow:visible;margin:0;padding:0}
.chip{flex:none;height:34px;padding:0 13px;border:1px solid var(--ink);border-radius:17px;background:var(--card);font-size:13.5px;font-weight:500;white-space:nowrap;display:inline-flex;align-items:center;gap:6px;text-decoration:none}
.chip[aria-pressed=true],.chip.on{background:var(--ink);color:#fff}
.chip.sq{border-radius:3px;min-width:44px;justify-content:center;font-family:var(--fc);font-weight:600;font-size:14.5px}
.chip.sq[aria-pressed=true]{background:var(--cobalt);border-color:var(--cobalt)}
.chip .sw{width:14px;height:14px;border-radius:50%;border:1px solid rgba(0,0,0,.25)}
.field{display:flex;align-items:center;gap:8px;height:46px;border:1px solid var(--ink);border-radius:4px;background:var(--card);padding:0 12px}
.field input,.field select{flex:1;min-width:0;border:0;background:none;outline:0;height:100%;font-size:16px}
.field:focus-within{outline:2px solid var(--cobalt);outline-offset:1px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:48px;padding:0 18px;border:1px solid var(--ink);border-radius:4px;background:var(--card);font-weight:600;font-size:15px;text-decoration:none;white-space:nowrap}
.btn.pri{background:var(--cobalt);border-color:var(--cobalt);color:#fff}
.btn.ink{background:var(--ink);color:#fff}
.btn.sm{height:38px;font-size:13.5px;padding:0 13px}
.btn.wide{width:100%}
.btn[disabled]{opacity:.45;cursor:default}
.row{display:flex;gap:8px;align-items:center}
.row > .grow{flex:1;min-width:0}
.bar{position:sticky;top:calc(51px + var(--sat));z-index:15;background:var(--paper);padding:10px 0 10px}
.bar .chips{margin-top:9px}
.meta{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:4px 0 14px;font-size:13px;color:var(--ink2)}
.meta select{border:0;background:none;font-weight:600;color:var(--ink);font-size:13.5px;padding:4px 0}
.malls{border:1px solid var(--ink);background:var(--card);border-radius:4px;padding:12px;margin-bottom:16px}
.malls p{font-size:13px;margin-bottom:9px}
.malls .chips{margin:0 -12px;padding:0 12px}
.malls .chip{border-color:var(--line)}

/* 빈 상태 */
.empty{border:1px dashed var(--ink3);border-radius:4px;padding:26px 18px;text-align:left;background:var(--card)}
.empty h3{font-size:16px;font-weight:700;margin-bottom:6px;letter-spacing:-.01em}
.empty p{font-size:14px;color:var(--ink2);margin-bottom:14px;max-width:34em}
.skel{aspect-ratio:4/5;background:var(--photo);border-radius:3px}

/* 시트 */
.sheet-wrap{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center}
.scrim{position:absolute;inset:0;background:rgba(0,0,0,.45);opacity:0;transition:opacity .18s}
.sheet{position:relative;width:100%;max-width:560px;max-height:calc(100dvh - 28px - var(--sat));background:var(--paper);border-radius:14px 14px 0 0;display:flex;flex-direction:column;transform:translateY(24px);opacity:0;transition:transform .2s ease,opacity .18s}
.sheet-wrap.on .scrim{opacity:1}
.sheet-wrap.on .sheet{transform:none;opacity:1}
@media(min-width:700px){.sheet-wrap{align-items:center}.sheet{border-radius:10px;max-height:min(880px,calc(100dvh - 48px))}}
.sh-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 14px 12px 16px;border-bottom:1px solid var(--line);flex:none}
.sh-head h2{font-size:16px;font-weight:700;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.x{width:36px;height:36px;display:grid;place-items:center;border-radius:50%;flex:none}
.sh-body{overflow-y:auto;padding:16px;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.sh-foot{flex:none;display:flex;gap:8px;padding:10px 14px calc(10px + var(--sab));border-top:1px solid var(--line);background:var(--paper)}
.sh-foot .btn{flex:1;padding:0 10px}
.sh-foot .btn.fix{flex:0 0 48px;padding:0}
.fs{margin-bottom:22px}
.fs > h3{font-size:14px;font-weight:700;margin-bottom:9px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.fs > h3 span{font-weight:400;font-size:12px;color:var(--ink2)}
.fs .chips.wrapx{row-gap:7px}

/* 상품 상세 */
.gal{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;margin:-16px -16px 14px;scrollbar-width:none;background:var(--photo)}
.gal::-webkit-scrollbar{display:none}
.gal img{flex:0 0 100%;aspect-ratio:1/1;object-fit:contain;scroll-snap-align:center;mix-blend-mode:multiply}
.gal.two img{flex-basis:88%}
.d-brand{font:600 14px var(--fc)}
.d-title{font-size:18px;font-weight:600;line-height:1.35;letter-spacing:-.015em;margin:2px 0 8px}
.d-price .now{font-size:24px}
.d-sub{font-size:12.5px;color:var(--ink2);margin-top:4px}
.why{display:flex;flex-wrap:wrap;gap:6px;margin:14px 0 0}
.why span{font-size:12.5px;padding:4px 9px;border-radius:3px;background:var(--card);border:1px solid var(--line)}
.kv{margin-top:18px;border-top:1px solid var(--line)}
.kv div{display:flex;justify-content:space-between;gap:14px;padding:9px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.kv dt{color:var(--ink2);flex:none}
.kv dd{text-align:right;min-width:0}
.hist{display:flex;align-items:flex-end;gap:5px;height:44px;margin-top:8px}
.hist i{flex:1;max-width:26px;background:var(--ink);min-height:3px}
.hist i:last-child{background:var(--cobalt)}
.linkrow{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}

/* 리스트(찜, 옷장, 코디) */
.list{display:flex;flex-direction:column}
.li{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);align-items:stretch}
.li .th{flex:0 0 84px;aspect-ratio:4/5;background:var(--photo);border-radius:3px;overflow:hidden}
.li .th img{width:100%;height:100%;object-fit:cover;mix-blend-mode:multiply}
.li .bd2{flex:1;min-width:0;display:flex;flex-direction:column}
.li .title{min-height:0}
.li .acts{margin-top:auto;display:flex;gap:6px;padding-top:8px;flex-wrap:wrap}
.delta{font:700 12.5px var(--fc)}
.delta.dn{color:var(--drop)} .delta.up{color:var(--ink2)}
.segc{display:flex;border:1px solid var(--ink);border-radius:4px;overflow:hidden;background:var(--card)}
.segc button{flex:1;height:38px;font-size:14px;font-weight:600;text-align:center}
.segc button[aria-pressed=true]{background:var(--ink);color:#fff}
.look{border:1px solid var(--ink);border-radius:4px;background:var(--card);padding:12px;margin-bottom:12px}
.look h3{font-size:15px;font-weight:700;display:flex;justify-content:space-between;gap:10px;align-items:center}
.look .pcs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:10px 0}
.look .pcs .p{aspect-ratio:4/5;background:var(--photo);border-radius:2px;overflow:hidden;position:relative}
.look .pcs img{width:100%;height:100%;object-fit:cover;mix-blend-mode:multiply}
.look .pcs .p em{position:absolute;left:0;bottom:0;font:600 10px/1 var(--f);font-style:normal;background:var(--cobalt);color:#fff;padding:3px 5px}
.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.slot{aspect-ratio:4/5;border:1px dashed var(--ink3);border-radius:3px;background:var(--card);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:12.5px;color:var(--ink2);position:relative;overflow:hidden;text-align:center}
.slot.has{border:1px solid var(--ink)}
.slot img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;mix-blend-mode:multiply}
.slot .lb{position:absolute;left:0;top:0;background:var(--ink);color:#fff;font-size:10.5px;padding:3px 6px;z-index:1}
.pick{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pick button{display:block;aspect-ratio:4/5;background:var(--photo);border-radius:3px;overflow:hidden;position:relative}
.pick img{width:100%;height:100%;object-fit:cover;mix-blend-mode:multiply}

/* MY */
.panel{border:1px solid var(--ink);border-radius:4px;background:var(--card);padding:14px;margin-bottom:12px}
.panel h3{font-size:15px;font-weight:700;margin-bottom:8px;letter-spacing:-.01em}
.panel p{font-size:13.5px;color:var(--ink2)}
.panel .row{margin-top:12px;flex-wrap:wrap}
.src{width:100%;border-collapse:collapse;font-size:13px;margin-top:6px}
.src td{padding:7px 0;border-bottom:1px solid var(--line);vertical-align:top}
.src td:last-child{text-align:right;white-space:nowrap}
.src .st{font-size:11.5px;color:var(--ink2);display:block}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--ink3);margin-right:6px;vertical-align:1px}
.dot.ok{background:#1E9E55}.dot.stale{background:#D9A300}.dot.bad{background:var(--drop)}

.toast{position:fixed;left:50%;bottom:calc(var(--tab) + var(--sab) + 14px);transform:translate(-50%,12px);background:var(--ink);color:#fff;font-size:13.5px;padding:10px 16px;border-radius:4px;z-index:80;opacity:0;transition:.2s;pointer-events:none;max-width:calc(100vw - 32px);text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <a class="mark" href="#home">MOAFIT</a>
  <span class="stamp" id="stamp"></span>
</div></header>

<main class="wrap" id="view" tabindex="-1"></main>

<nav class="tabs" aria-label="메뉴"><ul>
  <li><a href="#home" data-tab="home"><svg class="ic" viewBox="0 0 24 24"><path d="M3.5 12.3V4h8.3l8.7 8.7-7.9 7.9z"/><circle cx="8" cy="8.5" r="1.3"/></svg>추천</a></li>
  <li><a href="#explore" data-tab="explore"><svg class="ic" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4.5 4.5"/></svg>탐색</a></li>
  <li><a href="#wish" data-tab="wish"><svg class="ic" viewBox="0 0 24 24"><path d="M12 20.3S4.5 15.8 4.5 10.2A4.2 4.2 0 0 1 12 7.7a4.2 4.2 0 0 1 7.5 2.5c0 5.6-7.5 10.1-7.5 10.1z"/></svg>찜<span class="cnt hide" id="wishCnt"></span></a></li>
  <li><a href="#looks" data-tab="looks"><svg class="ic" viewBox="0 0 24 24"><path d="M12 8.6V7.3a2.2 2.2 0 1 0-2.2-2.2"/><path d="M12 8.6 3.4 15.4c-.8.7-.4 2 .7 2h15.8c1.100 0 1.5-1.300.7-2z"/></svg>코디</a></li>
  <li><a href="#my" data-tab="my"><svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.6"/><path d="M4.6 20c.8-3.500 3.800-5.400 7.400-5.400s6.600 1.900 7.400 5.400"/></svg>MY</a></li>
</ul></nav>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
'use strict';
/* ═════════════ 기본 도구 ═════════════ */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const won = (n) => Math.round(n).toLocaleString('ko-KR');
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const fold = (s) => String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').normalize('NFC');
const TODAY = new Date().toISOString().slice(0, 10);
const daysSince = (d) => (d ? Math.floor((Date.now() - new Date(d).getTime()) / 864e5) : 9999);
const hash = (s) => { let h = 2166136261; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return ((h >>> 0) % 1000) / 1000; };

  lookDraft = lk ? JSON.parse(JSON.stringify(lk)) : { id: 'l' + Date.now().toString(36), name: `코디 ${S.looks.length + 1}`, slots: {} };
  const body = () => `
    <div class="fs"><h3>이름</h3><label class="field"><input id="lk-name" value="${esc(lookDraft.name)}" maxlength="24"></label></div>
    <div class="fs"><h3>옷 고르기 <span>칸을 누르면 바꿀 수 있어요</span></h3><div class="slots">${SLOTS.map(([c, n]) => {
      const it = lookDraft.slots[c] ? getItem(lookDraft.slots[c]) : null;
      return `<button class="slot${it ? ' has' : ''}" data-act="slot" data-v="${c}"><span class="lb">${n}</span>${it ? `<img src="${esc(sizedImg(it.i, 300))}" data-full="${esc(it.i)}" alt="${esc(it.t)}" referrerpolicy="no-referrer">` : `${IC.plus}<span>${poolFor(c).length ? '고르기' : '후보 없음'}</span>`}</button>`;
    }).join('')}</div></div>
    <p class="note">찜했거나 옷장에 있는 옷이 후보로 나와요. 아직 없는 옷 합계: <b class="num" style="color:var(--ink)">${won(lookCost(lookDraft))}원</b></p>`;
  const w = openSheet('코디 만들기', body(), `<button class="btn" data-act="look-shuffle">다시 섞기</button><button class="btn pri" data-act="look-save">저장</button>`);
  w._rerender = () => { const n = $('#lk-name', w); if (n) lookDraft.name = n.value.trim() || lookDraft.name; const b = $('.sh-body', w), y = b.scrollTop; b.innerHTML = body(); b.scrollTop = y; };
}
function autoFill(lk) {
  const pools = Object.fromEntries(SLOTS.map(([c]) => [c, poolFor(c)]));
  const core = ['top', 'bottom', 'shoes', 'outer'].filter((c) => pools[c].length);
  if (!core.length) return lk;
  const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];
  const anchorCat = pick(core), anchor = pick(pools[anchorCat]);
  lk.slots = { [anchorCat]: anchor.id };
  let accent = (anchor.col || []).find((c) => !NEUTRAL.has(c)) || '';
  for (const [c] of SLOTS) {
    if (c === anchorCat || !pools[c].length) continue;
    if ((c === 'head' || c === 'bag') && Math.random() < 0.5) continue;
    let best = null, bs = -1e9;
    for (const x of pools[c]) {
      const cols = x.col || [];
      const loud = cols.find((k) => !NEUTRAL.has(k));
      let s = Math.random() * 1.5;
      if (S.closet[x.id]) s += 1.2;
      if (!loud) s += 1.5; else if (!accent) s += 0.8; else if (loud === accent) s += 0.3; else s -= 2.5;
      if (cols[0] && cols[0] === (anchor.col || [])[0] && cols[0] !== 'black') s -= 0.8;
      if (s > bs) { bs = s; best = x; }
    }
    if (best) { lk.slots[c] = best.id; const loud = (best.col || []).find((k) => !NEUTRAL.has(k)); if (loud && !accent) accent = loud; }
  }
  return lk;
}
function openPicker(cat) {
  const pool = poolFor(cat);
  const name = CATNAME[cat];
  const body = pool.length ? `<div class="pick">${pool.map((x) => `<button data-act="pick" data-v="${cat}" data-id="${esc(x.id)}" aria-label="${esc(x.t)}"><img src="${esc(sizedImg(x.i, 300))}" data-full="${esc(x.i)}" alt="" loading="lazy" referrerpolicy="no-referrer">${S.closet[x.id] ? '<span class="badges"><span class="bd own">보유</span></span>' : ''}</button>`).join('')}</div>`
    : `<div class="empty"><h3>고를 수 있는 ${name}이(가) 없어요</h3><p>탐색에서 ${name}을(를) 찜하거나, 옷장에 갖고 있는 옷을 추가하면 여기에 나와요.</p></div>`;
  openSheet(`${name} 고르기`, body, lookDraft.slots[cat] ? `<button class="btn" data-act="pick" data-v="${cat}" data-id="">이 칸 비우기</button>` : '');
}

  return parts.join(', ');
}

    <div class="panel"><h3>검색할 때 함께 열 쇼핑몰</h3><p>탐색에서 검색하면 고른 쇼핑몰의 검색 결과로 바로 가는 버튼이 나와요.</p>
      <div class="chips wrapx" style="margin-top:12px">${MALLS.map((m) => `<button class="chip" data-act="mall" data-v="${m[0]}" aria-pressed="${S.malls.includes(m[0])}">${m[1]}</button>`).join('')}</div></div>
    <div class="panel"><h3>홈 화면에 앱으로 추가</h3><p>아이폰: Safari 아래 공유 버튼 → ‘홈 화면에 추가’<br>안드로이드: Chrome 오른쪽 위 메뉴 → ‘홈 화면에 추가’ 또는 ‘앱 설치’</p>
      <div class="row hide" id="installRow"><button class="btn sm" data-act="install">지금 설치</button></div></div>
    <div class="panel"><h3>내 데이터 백업</h3><p>찜, 옷장, 코디, 취향은 이 기기에만 저장돼요. 기기를 바꾸기 전에 파일로 내보내 두세요.</p>
      <div class="row"><button class="btn sm" data-act="export">파일로 내보내기</button><label class="btn sm" style="cursor:pointer">파일에서 가져오기<input id="importFile" type="file" accept="application/json,.json" hidden></label><button class="btn sm" data-act="unhide"${Object.keys(S.hidden).length ? '' : ' disabled'}>숨긴 옷 ${Object.keys(S.hidden).length}개 되살리기</button></div></div>
    <div class="panel"><h3>수집 현황</h3><p>${when ? `마지막 수집 ${esc(when)}. ` : ''}하루 두 번 자동으로 다시 모아요. 사진과 가격은 각 스토어가 공개한 정보예요.</p>
      <table class="src"><tbody>${st.map((s) => `<tr><td><span class="dot ${s.state === 'ok' ? 'ok' : s.state === 'stale' ? 'stale' : 'bad'}"></span>${esc(s.name)}<span class="st">${esc(s.domain)}${s.state !== 'ok' ? ' · ' + (stName[s.state] || s.state) : ''}</span></td><td class="num">${s.count ? won(s.count) + '개' : '-'}</td></tr>`).join('') || '<tr><td>아직 수집 기록이 없어요</td><td></td></tr>'}</tbody></table>
      <div class="row"><button class="chip" data-act="global" aria-pressed="${P.global}">해외 스토어 상품도 보기</button></div></div>`;
  if (deferredInstall) $('#installRow').classList.remove('hide');
}
let pfDraft = null;
function openProfile() {
  pfDraft = JSON.parse(JSON.stringify(S.profile));
  const bc = {};
  for (const it of ITEMS) bc[it.b] = (bc[it.b] || 0) + 1;
  const brands = [...new Set([...pfDraft.brands, ...Object.entries(bc).sort((a, b) => b[1] - a[1]).slice(0, 48).map((x) => x[0])])];
  const one = (k, v, label, sq) => `<button class="chip${sq ? ' sq' : ''}" data-act="pf-one" data-k="${k}" data-v="${esc(v)}" aria-pressed="${String(pfDraft[k]) === String(v)}">${esc(label ?? v)}</button>`;
  const many = (k, v, label, sw) => `<button class="chip" data-act="pf-many" data-k="${k}" data-v="${esc(v)}" aria-pressed="${pfDraft[k].includes(v)}">${sw ? `<span class="sw" style="background:${sw}"></span>` : ''}${esc(label ?? v)}</button>`;
  const body = () => `
    <div class="fs"><h3>이름</h3><label class="field"><input id="pf-name" value="${esc(pfDraft.name)}" maxlength="12" placeholder="추천 문구에 쓰여요"></label></div>
    <div class="fs"><h3>주로 보는 옷</h3><div class="chips wrapx">${one('fit', 'm', '남성')}${one('fit', 'w', '여성')}${one('fit', 'all', '가리지 않음')}</div></div>

    <div class="fs"><h3>하의 사이즈 <span>둘 다 골라도 돼요</span></h3><div class="chips wrapx">${TOP_SIZES.map((s) => one('bottomA', s, s, 1)).join('')}</div><div class="chips wrapx" style="margin-top:8px">${WAISTS.map((s) => one('waist', s, s, 1)).join('')}</div></div>
    <div class="fs"><h3>신발 사이즈 <span>mm</span></h3><div class="chips wrapx">${SHOES.map((s) => one('shoe', s, s, 1)).join('')}</div></div>
    <div class="fs"><h3>좋아하는 스타일</h3><div class="chips wrapx">${STYLES.map((s) => many('styles', s.id, s.name)).join('')}</div></div>
    <div class="fs"><h3>좋아하는 브랜드 <span>지금 모인 스토어 기준</span></h3><div class="chips wrapx">${brands.length ? brands.map((b) => many('brands', b, b)).join('') : '<span class="note">상품이 모이면 여기에 브랜드가 나와요</span>'}</div></div>
    <div class="fs"><h3>자주 입는 색</h3><div class="chips wrapx">${Object.entries(COLORS).map(([id, [n, c]]) => many('colors', id, n, c)).join('')}</div></div>
    <div class="fs"><h3>한 벌 예산</h3><div class="chips wrapx">${BUDGETS.map(([n, l]) => one('budget', n, l)).join('')}</div></div>`;
  const w = openSheet('취향과 사이즈', body(), `<button class="btn pri" data-act="pf-save">저장</button>`);
  w._rerender = () => { const n = $('#pf-name', w); if (n) pfDraft.name = n.value.trim(); const b = $('.sh-body', w), y = b.scrollTop; b.innerHTML = body(); b.scrollTop = y; };

/* ═════════════ 라우팅 · 이벤트 ═════════════ */
const VIEWS = { home: viewHome, explore: viewExplore, wish: viewWish, looks: viewLooks, my: viewMy };
function current() { const h = location.hash.replace('#', ''); return VIEWS[h] ? h : 'home'; }
function route(keepScroll) {
  const tab = current();
  for (const a of $$('.tabs a')) { if (a.dataset.tab === tab) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current'); }
  const y = window.scrollY;
  VIEWS[tab]();
  window.scrollTo(0, keepScroll ? y : 0);
  const when = META?.updated ? new Date(META.updated) : null;
  $('#stamp').textContent = when ? `${when.toLocaleString('ko-KR', { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' })} 기준` : '';
}
window.addEventListener('hashchange', () => { if (!topSheet()) route(); });

let deferredInstall = null;
window.addEventListener('beforeinstallprompt', (e) => { e.preventDefault(); deferredInstall = e; $('#installRow')?.classList.remove('hide'); });

document.addEventListener('click', (e) => {
  const el = e.target.closest('[data-act]');
  if (!el) return;
  const { act, id, v, k } = el.dataset;
  const sheet = topSheet();
  const tgl = (arr, x) => { const i = arr.indexOf(x); if (i >= 0) arr.splice(i, 1); else arr.push(x); };
  switch (act) {
    case 'close': closeSheet(); break;
    case 'open': openProduct(id); break;
    case 'wish': toggleWish(id); if (current() === 'wish' && !sheet) route(true); break;
    case 'own': toggleOwn(id); if (sheet) { closeSheet(); } route(true); break;
    case 'hide': { const it = getItem(id); S.hidden[id] = 1; learn(it, 'hide'); save(); closeSheet(); route(true); toast('앞으로 이 옷은 안 보여요'); break; }
    case 'del-custom': delete S.custom[id]; delete S.wish[id]; delete S.closet[id]; for (const lk of S.looks) for (const c in lk.slots) if (lk.slots[c] === id) delete lk.slots[c]; save(); closeSheet(); syncWishUI(id); route(true); break;
    case 'reload': location.reload(); break;
    case 'profile': openProfile(); break;
    case 'pf-one': pfDraft[k] = k === 'budget' ? +v : (String(pfDraft[k]) === v && k !== 'fit' ? '' : v); sheet._rerender(); break;
    case 'pf-many': tgl(pfDraft[k], v); sheet._rerender(); break;
    case 'pf-save': { const n = $('#pf-name', sheet); if (n) pfDraft.name = n.value.trim(); S.profile = { ...pfDraft, onboarded: true }; save(); closeSheet(); route(); toast('저장했어요. 추천을 새로 골랐어요'); break; }
    case 'cat': F.cat = v; F.sub = ''; for (const c of $$('#cats .chip')) c.setAttribute('aria-pressed', c.dataset.v === v); renderResults(); window.scrollTo(0, 0); break;
    case 'filters': openFilters(); break;
    case 'filters-reset': { const keep = { q: F.q, cat: F.cat, sort: F.sort }; F = { ...F0(), ...keep }; if (sheet) sheet._rerender(); else renderResults(); break; }
    case 'f-tog': F[k] = !F[k]; sheet._rerender(); break;
    case 'f-sub': F.sub = F.sub === v ? '' : v; sheet._rerender(); break;
    case 'f-max': F.max = +v; sheet._rerender(); break;
    case 'f-arr': tgl(F[k], v); sheet._rerender(); break;
    case 'go-new': F = { ...F0(), fresh: true, mysize: !!(S.profile.top || S.profile.waist || S.profile.shoe) && false }; location.hash = '#explore'; break;
    case 'go-drop': F = { ...F0(), drop: true }; location.hash = '#explore'; break;
    case 'add-link': openAdd('wish'); break;
    case 'add-closet': openAdd('closet'); break;
    case 'a-fetch': addFetch(); break;
    case 'a-cat': sheet._sync(); draft.c = v; sheet._rerender(); break;
    case 'a-save': addSave(); break;
    case 'ltab': looksTab = v; route(); break;
    case 'look-new': openLook(null); break;
    case 'look-auto': openLook(null); autoFill(lookDraft); topSheet()._rerender(); break;
    case 'look-edit': openLook(S.looks.find((x) => x.id === id)); break;
    case 'look-del': S.looks = S.looks.filter((x) => x.id !== id); save(); route(true); break;
    case 'look-shuffle': sheet._rerender(); autoFill(lookDraft); sheet._rerender(); break;
    case 'look-save': { const n = $('#lk-name', sheet); if (n && n.value.trim()) lookDraft.name = n.value.trim(); if (!Object.values(lookDraft.slots).filter(Boolean).length) { toast('옷을 한 벌 이상 골라 주세요'); break; } const i = S.looks.findIndex((x) => x.id === lookDraft.id); if (i >= 0) S.looks[i] = lookDraft; else S.looks.unshift(lookDraft); save(); closeSheet(); route(); toast('코디를 저장했어요'); break; }
    case 'slot': sheet._rerender(); openPicker(v); break;
    case 'pick': if (id) lookDraft.slots[v] = id; else delete lookDraft.slots[v]; closeSheet(); setTimeout(() => topSheet()?._rerender?.(), 0); break;
    case 'mall': tgl(S.malls, v); save(); el.setAttribute('aria-pressed', S.malls.includes(v)); break;
    case 'global': S.profile.global = !S.profile.global; save(); el.setAttribute('aria-pressed', S.profile.global); break;
    case 'unhide': S.hidden = {}; save(); route(true); toast('숨긴 옷을 모두 되살렸어요'); break;
    case 'install': if (deferredInstall) { deferredInstall.prompt(); deferredInstall = null; } break;
    case 'export': {
      const blob = new Blob([JSON.stringify(S)], { type: 'application/json' });
      const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `moafit-backup-${TODAY}.json`; document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(a.href), 2000); toast('백업 파일을 내려받았어요'); break;
    }
  }
});
let qT = 0;
document.addEventListener('input', (e) => {
  if (e.target.id === 'q') { clearTimeout(qT); qT = setTimeout(() => { F.q = e.target.value; renderResults(); }, 180); }
});
document.addEventListener('change', async (e) => {
  const t = e.target;
  if (t.id === 'sort') { F.sort = t.value; renderResults(); }
  if (t.id === 'wsort') { wishSort = t.value; route(true); }
  if (t.id === 'a-file' && t.files[0]) { const w = topSheet(); w._sync(); try { draft.i = await fileToDataURL(t.files[0]); draft.msg = ''; } catch { draft.msg = '이 사진은 열 수 없어요. 다른 사진을 골라 주세요.'; } w._rerender(); }
  if (t.id === 'importFile' && t.files[0]) {
    try {
      const j = JSON.parse(await t.files[0].text());
      if (!j || typeof j !== 'object' || !j.profile) throw new Error('shape');
      const b = BLANK();
      S = { ...b, ...j, profile: { ...b.profile, ...j.profile }, w: { ...b.w, ...(j.w || {}) } };
      save(); syncWishUI(''); route(); toast('백업에서 가져왔어요');
    } catch { toast('MOAFIT 백업 파일이 아니에요'); }
  }
});
document.addEventListener('keydown', (e) => { if (e.key === 'Enter' && e.target.id === 'q') e.target.blur(); });

/* ═════════════ 시작 ═════════════ */
loadState();
syncWishUI('');
route();
loadCatalog().then(() => {
  route(true);
  if (!S.profile.onboarded && !LOAD_ERR && !sessionStorage.getItem('moafit:asked')) { try { sessionStorage.setItem('moafit:asked', '1'); } catch { /* 무시 */ } openProfile(); }
});
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
